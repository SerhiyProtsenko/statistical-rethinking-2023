readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "arviz[matplotlib]>=1.3.0,<2",
    "colorama>=0.4.6",
    "graphviz>=0.21",
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "networkx>=3.7",
    "numba>=0.67.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "patsy>=1.0.3",
    "pymc>=6.3.2,<7",
    "pytensor>=3.3.3,<3.4",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "watermark>=2.6.0",
    "xarray>=2026.9.0",
]
